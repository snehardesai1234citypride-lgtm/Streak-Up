<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect
    x="4"
    y="4"
    width="120"
    height="120"
    rx="30"
    fill="url(#background)"
  />

  <!-- Subtle glow -->
  <circle
    cx="94"
    cy="30"
    r="18"
    fill="#ffffff"
    opacity="0.10"
  />

  <!-- Rising streak -->
  <path
    d="M29 87 L50 66 L66 78 L96 43"
    fill="none"
    stroke="url(#shine)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrow head -->
  <path
    d="M78 43 H96 V61"
    fill="none"
    stroke="#ffffff"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Starting point -->
  <circle
    cx="29"
    cy="87"
    r="6"
    fill="#fbbf24"
  />

  <!-- Small achievement sparkle -->
  <path
    d="M38 31 L41 38 L48 41 L41 44 L38 51 L35 44 L28 41 L35 38 Z"
    fill="#ffffff"
    opacity="0.9"
  />
</svg>